      - name: Verify Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE -ErrorAction SilentlyContinue

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $msix = Join-Path $artifactDir "QuickPresenter-$($env:PACKAGE_VERSION).msix"
          $extractDir = Join-Path $env:RUNNER_TEMP 'quick-presenter-msix-extract'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'

          if (-not (Test-Path $msix -PathType Leaf)) {
            throw "Missing MSIX artifact: $msix"
          }
          if ((Get-Item $msix).Length -le 0) {
            throw "MSIX artifact is empty: $msix"
          }

          $makeAppxCommand = Get-Command 'makeappx.exe' -ErrorAction SilentlyContinue
          $makeAppxPath = if ($null -eq $makeAppxCommand) { "" } else { $makeAppxCommand.Source }
          if ([string]::IsNullOrWhiteSpace($makeAppxPath)) {
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $makeAppxPath = Get-ChildItem $sdkRoot -Recurse -Filter 'makeappx.exe' |
              Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($makeAppxPath)) {
            throw "Could not find makeappx.exe for MSIX verification"
          }

          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null

          & $makeAppxPath unpack /p $msix /d $extractDir /o
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX unpack failed with exit code $LASTEXITCODE"
          }

          $manifest = Join-Path $extractDir 'AppxManifest.xml'
          $exe = Join-Path $extractDir 'quick-presenter.exe'
          $pdfiumDir = Join-Path $extractDir 'pdfium'
          $licenseDir = Join-Path $extractDir 'licenses'
          $assetsDir = Join-Path $extractDir 'Assets'

          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing AppxManifest.xml"
          }
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing quick-presenter.exe"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'LICENSE') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing bundled PDFium license"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'VERSION') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing bundled PDFium version file"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'licenses') -PathType Container)) {
            throw "Unpacked MSIX layout is missing PDFium component licenses"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'QuickPresenter-LICENSE.txt') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Quick Presenter license"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'PDFium-LICENSE.txt') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing PDFium license copy"
          }
          if (-not (Test-Path (Join-Path $assetsDir 'Square44x44Logo.png') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Square44x44Logo.png"
          }
          if (-not (Test-Path (Join-Path $assetsDir 'StoreLogo.png') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing StoreLogo.png"
          }
          if (-not (Test-Path (Join-Path $assetsDir 'Square150x150Logo.png') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Square150x150Logo.png"
          }

          $manifestText = Get-Content $manifest -Raw
          if ($manifestText -notmatch 'Name="QuickPresenter\.QuickPresenter"') {
            throw "MSIX manifest has unexpected identity name"
          }
          if ($manifestText -notmatch 'ProcessorArchitecture="x64"') {
            throw "MSIX manifest has unexpected processor architecture"
          }
          if ($manifestText -notmatch 'Name="Windows\.Desktop"') {
            throw "MSIX manifest is missing Windows.Desktop target family"
          }
          if ($manifestText -notmatch '<Logo>Assets\\StoreLogo\.png</Logo>') {
            throw "MSIX manifest is missing StoreLogo.png package logo"
          }
          if ($manifestText -notmatch 'Executable="quick-presenter\.exe"') {
            throw "MSIX manifest is missing quick-presenter.exe application entry"
          }
          if ($manifestText -notmatch 'Name="runFullTrust"') {
            throw "MSIX manifest is missing runFullTrust capability"
          }

          Push-Location $env:TEMP
          try {
            $smokeProcess = Start-Process `
              -FilePath $exe `
              -ArgumentList @('--smoke-open-pdf', $pdf) `
              -Wait `
              -PassThru
            if ($smokeProcess.ExitCode -ne 0) {
              throw "Unpacked MSIX smoke test failed with exit code $($smokeProcess.ExitCode)"
            }
          } finally {
            Pop-Location
          }

      - name: Build Windows Store MSIX
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/build_windows_msix.ps1 `
