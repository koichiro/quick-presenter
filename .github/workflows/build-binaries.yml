name: Build Binaries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-binaries.yml'
      - '.cargo/audit.toml'
      - 'scripts/audit_deps.sh'
      - 'scripts/build_*'
      - 'scripts/stage_*'
      - 'scripts/sign_*'
      - 'scripts/create_macos_dmg.sh'
      - 'scripts/notarize_macos_dmg.sh'
      - 'scripts/check_macos_renderer.py'
      - 'src/macos_renderer*'
      - 'src/pdf.rs'
      - 'build.rs'
      - 'scripts/fetch_pdfium.py'
      - 'scripts/pdfium_manifest.json'
      - 'scripts/generate_icons.py'
      - 'tests/test_fetch_pdfium.py'
      - 'packaging/**'
      - 'assets/icons/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/renderer_helper.rs'
      - 'src/renderer_limits.rs'
      - 'src/renderer_resources.rs'
      - 'src/renderer_supervision.rs'
      - 'src/renderer_protocol.rs'
      - 'src/renderer_sandbox_linux.rs'
      - 'src/renderer_process.rs'
      - 'scripts/check_renderer_sandbox.py'
      - 'scripts/check_windows_msix_sandbox.ps1'
      - 'src/render_scheduler.rs'
      - 'tests/renderer_process.rs'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  dependency-audit:
    name: Dependency advisory audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: scripts/audit_deps.sh

  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    needs: dependency-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: quick-presenter-ubuntu-x64
            binary-name: quick-presenter
          - os: macos-latest
            artifact-name: quick-presenter-macos
            binary-name: quick-presenter
          - os: windows-latest
            artifact-name: quick-presenter-windows-x64
            binary-name: quick-presenter.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            dpkg-dev \
            libgtk-3-bin \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            pkg-config \
            xauth \
            xvfb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test PDFium fetch script
        run: python -m unittest tests/test_fetch_pdfium.py

      - name: Fetch PDFium
        run: python scripts/fetch_pdfium.py --clean

      - name: Test renderer process boundary
        run: cargo test --test renderer_process

      - name: Build release binary
        run: cargo build --release --bin quick-presenter

      - name: Read package version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "$package_version" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Prepare Windows signing certificate
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $enabled = (
            $env:EVENT_NAME -ne 'pull_request' -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)
          )

          if (-not $enabled) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Windows signing is disabled for this run."
            "Windows MSI, direct MSIX, and raw executable outputs are CI validation artifacts only; v1.0.0 is distributed through Microsoft Store." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          $timestampUrl = $env:WINDOWS_SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }

          $publisher = $env:WINDOWS_SIGNING_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            $publisher = 'CN=Quick Presenter'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'quick-presenter-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [System.Convert]::FromBase64String(($env:WINDOWS_SIGNING_CERT_PFX_BASE64 -replace '\s', ''))
          )
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:WINDOWS_SIGNING_CERT_PASSWORD
          )
          $allowUntrustedSelfSigned = ($certificate.Subject -eq $certificate.Issuer).ToString().ToLowerInvariant()

          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "timestamp_url=$timestampUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "allow_untrusted_self_signed=$allowUntrustedSelfSigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($allowUntrustedSelfSigned -eq 'true') {
            Write-Warning "The configured certificate is self-signed. Outputs are non-production CI validation artifacts and must not be published."
            "Windows signing used a self-signed test certificate. These outputs do not satisfy the v1.0.0 trust gate and must not be published." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Sign Windows release binary
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/sign_windows_artifacts.ps1 `
            -Path 'target/release/${{ matrix.binary-name }}' `
            -PfxPath '${{ steps.windows-signing.outputs.pfx_path }}' `
            -PfxPassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' `
            -ExpectedPublisher '${{ steps.windows-signing.outputs.publisher }}' `
            -ExpectedThumbprint '${{ steps.windows-signing.outputs.thumbprint }}' `
            -AllowUntrustedSelfSigned:([System.Convert]::ToBoolean('${{ steps.windows-signing.outputs.allow_untrusted_self_signed }}'))

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          mkdir -p "$artifact_dir"
          mkdir -p "$artifact_dir/gui-smoke"

          cp "target/release/${{ matrix.binary-name }}" "$artifact_dir/"
          cp -R pdfium "$artifact_dir/pdfium"

          cat > "$artifact_dir/README.txt" <<README
          Quick Presenter packaged artifact.

          This archive contains the release package for this platform, plus
          the raw quick-presenter executable and PDFium files used to build or validate it.

          Supported v1.0.0 installation paths:

          - macOS: QuickPresenter-${PACKAGE_VERSION}.dmg
          - Windows: Microsoft Store ID 9N913S9NJ6D1
          - Ubuntu: quick-presenter_${PACKAGE_VERSION}_amd64.deb

          Windows MSI, direct MSIX, and raw executable files in this archive are
          CI validation artifacts. They are not supported v1.0.0 downloads.
          The Store-identity MSIX is a Partner Center submission input and is
          supported only after Microsoft Store certification and signing.

          Raw quick-presenter or quick-presenter.exe binaries are development and diagnostic artifacts.
          macOS raw release executables cannot render PDFs; the signed app bundle
          is required. Ad-hoc CI app bundles/DMGs are layout artifacts and reject
          PDF work until signed with a trusted Apple developer identity.
          If you run or move a raw executable directly, keep the pdfium directory
          next to it because the executable locates bundled PDFium files relative
          to its own path.

          PDFIUM_DYNAMIC_LIB_PATH remains available as a development override.
          Packaged builds require QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE=1
          before honoring that override.
          README

      - name: Stage Linux desktop metadata
        if: runner.os == 'Linux'
        run: scripts/stage_linux_desktop_assets.sh "artifacts/${{ matrix.artifact-name }}"

      - name: Stage macOS app bundle
        if: runner.os == 'macOS'
        run: scripts/stage_macos_app_bundle.sh "artifacts/${{ matrix.artifact-name }}" "target/release/${{ matrix.binary-name }}"

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          app="$artifact_dir/Quick Presenter.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/quick-presenter"
          resources="$app/Contents/Resources"

          test -x "$executable"
          test -s "$plist"
          test -s "$resources/QuickPresenter.icns"
          test -s "$resources/pdfium/LICENSE"
          test -s "$resources/pdfium/VERSION"
          test -d "$resources/pdfium/licenses"
          test -s "$resources/licenses/QuickPresenter-LICENSE.txt"
          test -s "$resources/licenses/PDFium-LICENSE.txt"

          proxy="$app/Contents/Helpers/RendererProxy.app"
          service="$proxy/Contents/XPCServices/org.quickpresenter.renderer.xpc"
          test -x "$proxy/Contents/MacOS/quick-presenter-proxy"
          test -x "$service/Contents/MacOS/quick-presenter-renderer"
          test -s "$service/Contents/Resources/pdfium/lib/libpdfium.dylib"
          plutil -lint "$proxy/Contents/Info.plist" "$service/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Quick Presenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Quick Presenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "quick-presenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" = "QuickPresenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrincipalClass' "$plist")" = "NSApplication"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          scripts/create_macos_dmg.sh \
            "$artifact_dir/Quick Presenter.app" \
            "$artifact_dir/QuickPresenter-${PACKAGE_VERSION}.dmg"

      - name: Verify macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact-name }}"
          dmg="$artifact_dir/QuickPresenter-${PACKAGE_VERSION}.dmg"
          pdf="$GITHUB_WORKSPACE/tests/fixtures/marp-speaker-notes.pdf"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/quick-presenter-dmg.XXXXXX")"

          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          test -s "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"

          app="$mount_dir/Quick Presenter.app"
          resources="$app/Contents/Resources"

          test -d "$app"
          test -L "$mount_dir/Applications"
          test -x "$app/Contents/MacOS/quick-presenter"
          test -s "$app/Contents/Info.plist"
          test -s "$resources/QuickPresenter.icns"
          test -s "$resources/pdfium/LICENSE"
          test -s "$resources/pdfium/VERSION"
          test -d "$resources/pdfium/licenses"
          test -s "$resources/licenses/QuickPresenter-LICENSE.txt"
          test -s "$resources/licenses/PDFium-LICENSE.txt"

          python3 scripts/check_macos_renderer.py "$app" "$pdf" --expect-untrusted

      - name: Record macOS GUI smoke CI skip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          report_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact-name }}/gui-smoke"
          cat > "$report_dir/macos-skipped.txt" <<'REPORT'
          Quick Presenter GUI Smoke Report
          Result: skipped

          The macOS packaged artifact GUI smoke check is intentionally manual in Build Binaries.
          GitHub-hosted macOS runners do not provide the normal signed-in desktop session needed
          to treat Slint window, focus, Space, Dock, Cmd+Tab, and Gatekeeper behavior as a reliable
          release gate. Run docs/GUI_SMOKE_CHECKLIST.md against the final macOS artifact.
          REPORT

      - name: Verify Linux desktop metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          desktop_file="$artifact_dir/share/applications/quick-presenter.desktop"

          test -s "$desktop_file"
          grep -Fx "Type=Application" "$desktop_file"
          grep -Fx "Name=Quick Presenter" "$desktop_file"
          grep -Fx "Exec=/usr/bin/quick-presenter %f" "$desktop_file"
          grep -Fx "Icon=quick-presenter" "$desktop_file"
          grep -Fx "StartupWMClass=quick-presenter" "$desktop_file"
          grep -Fx "MimeType=application/pdf;" "$desktop_file"

          desktop-file-validate "$desktop_file"

          for size in 16 24 32 48 64 128 256 512 1024; do
            icon="$artifact_dir/share/icons/hicolor/${size}x${size}/apps/quick-presenter.png"
            test -s "$icon"
          done

          gtk-update-icon-cache --ignore-theme-index --force "$artifact_dir/share/icons/hicolor"

      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        run: |
          scripts/build_linux_deb.sh \
            --artifact-dir "artifacts/${{ matrix.artifact-name }}" \
            --binary "target/release/${{ matrix.binary-name }}"

      - name: Verify Linux Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact-name }}"
          deb="$artifact_dir/quick-presenter_${PACKAGE_VERSION}_amd64.deb"
          extract_dir="$RUNNER_TEMP/quick-presenter-deb-extract"
          pdf="$GITHUB_WORKSPACE/tests/fixtures/marp-speaker-notes.pdf"

          test -s "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$PACKAGE_VERSION"
          dpkg-deb --field "$deb" Depends | grep -F "desktop-file-utils"
          dpkg-deb --field "$deb" Depends | grep -F "hicolor-icon-theme"
          dpkg-deb --contents "$deb" | tee "$RUNNER_TEMP/quick-presenter-deb-contents.txt"

          grep -F "./usr/bin/quick-presenter" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/quick-presenter" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/pdfium/LICENSE" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/pdfium/VERSION" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/pdfium/licenses/" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/licenses/QuickPresenter-LICENSE.txt" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/licenses/QuickPresenter-SOURCE-OFFER.txt" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/lib/quick-presenter/licenses/PDFium-LICENSE.txt" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/share/applications/quick-presenter.desktop" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"
          grep -F "./usr/share/icons/hicolor/256x256/apps/quick-presenter.png" "$RUNNER_TEMP/quick-presenter-deb-contents.txt"

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          dpkg-deb -x "$deb" "$extract_dir"

          test -x "$extract_dir/usr/lib/quick-presenter/quick-presenter"
          test -L "$extract_dir/usr/bin/quick-presenter"
          test -s "$extract_dir/usr/lib/quick-presenter/pdfium/LICENSE"
          test -s "$extract_dir/usr/lib/quick-presenter/pdfium/VERSION"
          test -d "$extract_dir/usr/lib/quick-presenter/pdfium/licenses"
          test -s "$extract_dir/usr/lib/quick-presenter/licenses/QuickPresenter-LICENSE.txt"
          test -s "$extract_dir/usr/lib/quick-presenter/licenses/QuickPresenter-SOURCE-OFFER.txt"
          test -s "$extract_dir/usr/lib/quick-presenter/licenses/PDFium-LICENSE.txt"
          test -s "$extract_dir/usr/share/doc/quick-presenter/QuickPresenter-SOURCE-OFFER.txt"

          test "$(stat -c '%a' "$extract_dir/usr/lib/quick-presenter/quick-presenter")" = "755"
          test "$(stat -c '%a' "$extract_dir/usr/lib/quick-presenter")" = "755"
          test "$(stat -c '%a' "$extract_dir/usr/share/icons/hicolor/256x256/apps")" = "755"
          test "$(stat -c '%a' "$extract_dir/usr/share/applications/quick-presenter.desktop")" = "644"
          test "$(stat -c '%a' "$extract_dir/usr/share/icons/hicolor/256x256/apps/quick-presenter.png")" = "644"
          test "$(stat -c '%a' "$extract_dir/usr/lib/quick-presenter/licenses/QuickPresenter-LICENSE.txt")" = "644"
          test "$(stat -c '%a' "$extract_dir/usr/lib/quick-presenter/licenses/QuickPresenter-SOURCE-OFFER.txt")" = "644"

          if find "$extract_dir" \( -type f -o -type d \) -perm /020 -print -quit | grep -q .; then
            echo "Debian package contains group-writable files or directories" >&2
            find "$extract_dir" \( -type f -o -type d \) -perm /020 -ls >&2
            exit 1
          fi

          grep -Fx "Exec=/usr/bin/quick-presenter %f" "$extract_dir/usr/share/applications/quick-presenter.desktop"
          grep -Fx "StartupWMClass=quick-presenter" "$extract_dir/usr/share/applications/quick-presenter.desktop"
          grep -Fx "MimeType=application/pdf;" "$extract_dir/usr/share/applications/quick-presenter.desktop"
          desktop-file-validate "$extract_dir/usr/share/applications/quick-presenter.desktop"
          gtk-update-icon-cache --ignore-theme-index --force "$extract_dir/usr/share/icons/hicolor"

          (
            cd /tmp
            env -u PDFIUM_DYNAMIC_LIB_PATH -u QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE "$extract_dir/usr/lib/quick-presenter/quick-presenter" \
              --smoke-open-pdf "$pdf"
          )

          (
            cd /tmp
            PATH="$extract_dir/usr/bin:$PATH" env -u PDFIUM_DYNAMIC_LIB_PATH -u QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE quick-presenter \
              --smoke-open-pdf "$pdf"
          )

          sudo apt-get install -y "$deb"
          trap 'sudo apt-get remove -y quick-presenter || true' EXIT
          env -u PDFIUM_DYNAMIC_LIB_PATH -u QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE \
            python3 scripts/check_renderer_sandbox.py /usr/lib/quick-presenter/quick-presenter "$pdf"
          test -s /usr/share/applications/mimeinfo.cache
          grep -F "application/pdf=" /usr/share/applications/mimeinfo.cache | grep -F "quick-presenter.desktop"
          (
            cd /tmp
            env -u PDFIUM_DYNAMIC_LIB_PATH -u QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE quick-presenter --smoke-open-pdf "$pdf"
          )

          (
            cd /tmp
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              env -u PDFIUM_DYNAMIC_LIB_PATH -u QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE \
                LIBGL_ALWAYS_SOFTWARE=1 \
                quick-presenter \
                --gui-smoke "$pdf" \
                --gui-smoke-report "$artifact_dir/gui-smoke/ubuntu-deb-installed.txt"
          )
          sudo apt-get remove -y quick-presenter
          if test -e /usr/share/applications/quick-presenter.desktop; then
            echo "Debian package removal left quick-presenter.desktop behind" >&2
            exit 1
          fi
          if [[ -f /usr/share/applications/mimeinfo.cache ]]; then
            if grep -F "quick-presenter.desktop" /usr/share/applications/mimeinfo.cache; then
              echo "Debian package removal left quick-presenter.desktop in mimeinfo.cache" >&2
              exit 1
            fi
          fi
          trap - EXIT

      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = 'artifacts/${{ matrix.artifact-name }}'
          $exe = Join-Path $artifactDir '${{ matrix.binary-name }}'
          $preview = Join-Path $artifactDir 'quick-presenter-associated-icon.png'
          $previewFullPath = [System.IO.Path]::GetFullPath($preview)

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $icon) {
            throw "Windows could not extract an associated icon from $exe"
          }

          $bitmap = $icon.ToBitmap()
          $bitmap.Save($previewFullPath, [System.Drawing.Imaging.ImageFormat]::Png)

          if ((Get-Item $preview).Length -le 0) {
            throw "Extracted icon preview is empty"
          }

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/build_windows_msi.ps1 `
            -ArtifactDir 'artifacts/${{ matrix.artifact-name }}' `
            -Binary 'target/release/${{ matrix.binary-name }}'

      - name: Verify Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE -ErrorAction SilentlyContinue

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $msi = Join-Path $artifactDir "QuickPresenter-$($env:PACKAGE_VERSION).msi"
          $extractDir = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-extract'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'

          if (-not (Test-Path $msi -PathType Leaf)) {
            throw "Missing MSI artifact: $msi"
          }

          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null

          $msiLog = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-extract.log'
          $msiArgs = @(
            '/a',
            "`"$msi`"",
            '/qn',
            "TARGETDIR=`"$extractDir`"",
            '/l*v',
            "`"$msiLog`""
          )
          $msiProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            if (Test-Path $msiLog -PathType Leaf) {
              Get-Content $msiLog -Tail 120
            }
            throw "Administrative MSI extraction failed with exit code $($msiProcess.ExitCode)"
          }

          $exe = Get-ChildItem $extractDir -Recurse -Filter 'quick-presenter.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Extracted MSI layout does not contain quick-presenter.exe"
          }

          $installDir = $exe.Directory.FullName
          $pdfiumDir = Join-Path $installDir 'pdfium'
          $licenseDir = Join-Path $installDir 'licenses'

          if (-not (Test-Path (Join-Path $pdfiumDir 'LICENSE') -PathType Leaf)) {
            throw "Extracted MSI layout is missing bundled PDFium license"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'VERSION') -PathType Leaf)) {
            throw "Extracted MSI layout is missing bundled PDFium version file"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'licenses') -PathType Container)) {
            throw "Extracted MSI layout is missing PDFium component licenses"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'QuickPresenter-LICENSE.txt') -PathType Leaf)) {
            throw "Extracted MSI layout is missing Quick Presenter license"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'PDFium-LICENSE.txt') -PathType Leaf)) {
            throw "Extracted MSI layout is missing PDFium license copy"
          }

          Push-Location $env:TEMP
          try {
            $smokeProcess = Start-Process `
              -FilePath $exe.FullName `
              -ArgumentList @('--smoke-open-pdf', $pdf) `
              -Wait `
              -PassThru
            if ($smokeProcess.ExitCode -ne 0) {
              throw "Extracted MSI smoke test failed with exit code $($smokeProcess.ExitCode)"
            }
          } finally {
            Pop-Location
          }

      - name: Verify installed Windows MSI renderer sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QUICK_PRESENTER_ALLOW_PDFIUM_OVERRIDE -ErrorAction SilentlyContinue
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $msi = Join-Path $artifactDir "QuickPresenter-$($env:PACKAGE_VERSION).msi"
          $installDir = Join-Path $env:ProgramFiles 'Quick Presenter'
          $exe = Join-Path $installDir 'quick-presenter.exe'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'
          $installLog = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-uninstall.log'
          # The x64 payload must also be authored as an x64 MSI. A default x86
          # package redirects even an explicit Program Files path to (x86).
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi, 0)
          $summary = $database.SummaryInformation(0)
          $template = $summary.Property(7)
          if (($template -split ';')[0] -ne 'x64') {
            throw "Expected x64 MSI Template Summary, got: $template"
          }
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($summary)
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($database)
          [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
          # A disposable hosted runner: use the real per-machine installation,
          # not administrative extraction or a development PDFium override.
          try {
            $install = Start-Process msiexec.exe -ArgumentList @(
              '/i', "`"$msi`"", '/qn', '/norestart',
              "INSTALLFOLDER=`"$installDir`"", '/l*v', "`"$installLog`""
            ) -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) {
              if (Test-Path $installLog) { Get-Content $installLog -Tail 80 }
              throw "MSI installation failed with exit code $($install.ExitCode)"
            }
            if (-not (Test-Path $exe -PathType Leaf)) {
              if (Test-Path $installLog) { Get-Content $installLog -Tail 120 }
              throw "Installed MSI executable missing at the explicit INSTALLFOLDER: $exe"
            }
            python scripts/check_renderer_sandbox.py $exe $pdf
            if ($LASTEXITCODE -ne 0) { throw 'Installed MSI renderer denial gate failed' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @(
              '/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`""
            ) -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010, 1605)) {
              throw "MSI cleanup failed with exit code $($uninstall.ExitCode)"
            }
          }

      - name: Upload installed Windows MSI verification logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-msi-verification-logs
          path: |
            ${{ runner.temp }}/quick-presenter-msi-install.log
            ${{ runner.temp }}/quick-presenter-msi-uninstall.log
          if-no-files-found: ignore

      - name: Verify installed Store-identity MSIX renderer sandbox
        if: runner.os == 'Windows'
