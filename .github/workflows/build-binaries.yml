name: Build Binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: quick-presenter-ubuntu-x64
            binary-name: qp
          - os: macos-latest
            artifact-name: quick-presenter-macos
            binary-name: qp
          - os: windows-latest
            artifact-name: quick-presenter-windows-x64
            binary-name: qp.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libgtk-3-bin \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch PDFium
        run: python scripts/fetch_pdfium.py

      - name: Build release binary
        run: cargo build --release --bin qp

      - name: Prepare Windows signing certificate
        id: windows-signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'

          $enabled = (
            $env:EVENT_NAME -ne 'pull_request' -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PFX_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)
          )

          if (-not $enabled) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Windows signing is disabled for this run."
            exit 0
          }

          $timestampUrl = $env:WINDOWS_SIGNING_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }

          $publisher = $env:WINDOWS_SIGNING_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            $publisher = 'CN=Quick Presenter'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'quick-presenter-signing.pfx'
          [System.IO.File]::WriteAllBytes(
            $pfxPath,
            [System.Convert]::FromBase64String(($env:WINDOWS_SIGNING_CERT_PFX_BASE64 -replace '\s', ''))
          )

          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "timestamp_url=$timestampUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Sign Windows release binary
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/sign_windows_artifacts.ps1 `
            -Path 'target/release/${{ matrix.binary-name }}' `
            -PfxPath '${{ steps.windows-signing.outputs.pfx_path }}' `
            -PfxPassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' `
            -ExpectedPublisher '${{ steps.windows-signing.outputs.publisher }}'

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          mkdir -p "$artifact_dir"

          cp "target/release/${{ matrix.binary-name }}" "$artifact_dir/"
          cp -R pdfium "$artifact_dir/pdfium"

          cat > "$artifact_dir/README.txt" <<'README'
          Quick Presenter development binary artifact.

          This archive contains the qp executable and the PDFium files
          downloaded by scripts/fetch_pdfium.py during the workflow run.

          The executable locates the bundled PDFium files relative to its own
          path. If you move the executable, keep the pdfium directory next to it.

          PDFIUM_DYNAMIC_LIB_PATH remains available as a development override.

          Full installer or disk image packaging is intentionally out of scope
          for this workflow.
          README

      - name: Stage Linux desktop metadata
        if: runner.os == 'Linux'
        run: scripts/stage_linux_desktop_assets.sh "artifacts/${{ matrix.artifact-name }}"

      - name: Stage macOS app bundle
        if: runner.os == 'macOS'
        run: scripts/stage_macos_app_bundle.sh "artifacts/${{ matrix.artifact-name }}" "target/release/${{ matrix.binary-name }}"

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          app="$artifact_dir/Quick Presenter.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/qp"
          resources="$app/Contents/Resources"

          test -x "$executable"
          test -s "$plist"
          test -s "$resources/QuickPresenter.icns"
          test -s "$resources/pdfium/LICENSE"
          test -d "$resources/pdfium/licenses"
          test -s "$resources/licenses/QuickPresenter-LICENSE.txt"
          test -s "$resources/licenses/PDFium-LICENSE.txt"

          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Quick Presenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Quick Presenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "qp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" = "QuickPresenter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrincipalClass' "$plist")" = "NSApplication"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          scripts/create_macos_dmg.sh \
            "$artifact_dir/Quick Presenter.app" \
            "$artifact_dir/Quick Presenter.dmg"

      - name: Verify macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact-name }}"
          dmg="$artifact_dir/Quick Presenter.dmg"
          pdf="$GITHUB_WORKSPACE/tests/fixtures/marp-speaker-notes.pdf"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/quick-presenter-dmg.XXXXXX")"

          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT

          test -s "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"

          app="$mount_dir/Quick Presenter.app"
          resources="$app/Contents/Resources"

          test -d "$app"
          test -L "$mount_dir/Applications"
          test -x "$app/Contents/MacOS/qp"
          test -s "$app/Contents/Info.plist"
          test -s "$resources/QuickPresenter.icns"
          test -s "$resources/pdfium/LICENSE"
          test -d "$resources/pdfium/licenses"
          test -s "$resources/licenses/QuickPresenter-LICENSE.txt"
          test -s "$resources/licenses/PDFium-LICENSE.txt"

          env -u PDFIUM_DYNAMIC_LIB_PATH "$app/Contents/MacOS/qp" \
            --smoke-open-pdf "$pdf"

      - name: Verify Linux desktop metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/${{ matrix.artifact-name }}"
          desktop_file="$artifact_dir/share/applications/quick-presenter.desktop"

          test -s "$desktop_file"
          grep -Fx "Type=Application" "$desktop_file"
          grep -Fx "Name=Quick Presenter" "$desktop_file"
          grep -Fx "Exec=qp %f" "$desktop_file"
          grep -Fx "Icon=quick-presenter" "$desktop_file"

          desktop-file-validate "$desktop_file"

          for size in 16 24 32 48 64 128 256 512 1024; do
            icon="$artifact_dir/share/icons/hicolor/${size}x${size}/apps/quick-presenter.png"
            test -s "$icon"
          done

          gtk-update-icon-cache --ignore-theme-index --force "$artifact_dir/share/icons/hicolor"

      - name: Verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $artifactDir = 'artifacts/${{ matrix.artifact-name }}'
          $exe = Join-Path $artifactDir '${{ matrix.binary-name }}'
          $preview = Join-Path $artifactDir 'qp-associated-icon.png'
          $previewFullPath = [System.IO.Path]::GetFullPath($preview)

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          if ($null -eq $icon) {
            throw "Windows could not extract an associated icon from $exe"
          }

          $bitmap = $icon.ToBitmap()
          $bitmap.Save($previewFullPath, [System.Drawing.Imaging.ImageFormat]::Png)

          if ((Get-Item $preview).Length -le 0) {
            throw "Extracted icon preview is empty"
          }

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/build_windows_msi.ps1 `
            -ArtifactDir 'artifacts/${{ matrix.artifact-name }}' `
            -Binary 'target/release/${{ matrix.binary-name }}'

      - name: Verify Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $msi = Join-Path $artifactDir 'Quick Presenter.msi'
          $extractDir = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-extract'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'

          if (-not (Test-Path $msi -PathType Leaf)) {
            throw "Missing MSI artifact: $msi"
          }

          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null

          $msiLog = Join-Path $env:RUNNER_TEMP 'quick-presenter-msi-extract.log'
          $msiArgs = @(
            '/a',
            "`"$msi`"",
            '/qn',
            "TARGETDIR=`"$extractDir`"",
            '/l*v',
            "`"$msiLog`""
          )
          $msiProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            if (Test-Path $msiLog -PathType Leaf) {
              Get-Content $msiLog -Tail 120
            }
            throw "Administrative MSI extraction failed with exit code $($msiProcess.ExitCode)"
          }

          $exe = Get-ChildItem $extractDir -Recurse -Filter 'qp.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Extracted MSI layout does not contain qp.exe"
          }

          $installDir = $exe.Directory.FullName
          $pdfiumDir = Join-Path $installDir 'pdfium'
          $licenseDir = Join-Path $installDir 'licenses'

          if (-not (Test-Path (Join-Path $pdfiumDir 'LICENSE') -PathType Leaf)) {
            throw "Extracted MSI layout is missing bundled PDFium license"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'licenses') -PathType Container)) {
            throw "Extracted MSI layout is missing PDFium component licenses"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'QuickPresenter-LICENSE.txt') -PathType Leaf)) {
            throw "Extracted MSI layout is missing Quick Presenter license"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'PDFium-LICENSE.txt') -PathType Leaf)) {
            throw "Extracted MSI layout is missing PDFium license copy"
          }

          Push-Location $env:TEMP
          try {
            & $exe.FullName --smoke-open-pdf $pdf
            if ($LASTEXITCODE -ne 0) {
              throw "Extracted MSI smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Build Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER: ${{ steps.windows-signing.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publisher = $env:WINDOWS_SIGNING_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            $publisher = 'CN=Quick Presenter'
          }
          scripts/build_windows_msix.ps1 `
            -ArtifactDir 'artifacts/${{ matrix.artifact-name }}' `
            -Binary 'target/release/${{ matrix.binary-name }}' `
            -Publisher $publisher

      - name: Verify Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $msix = Join-Path $artifactDir 'Quick Presenter.msix'
          $extractDir = Join-Path $env:RUNNER_TEMP 'quick-presenter-msix-extract'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'

          if (-not (Test-Path $msix -PathType Leaf)) {
            throw "Missing MSIX artifact: $msix"
          }
          if ((Get-Item $msix).Length -le 0) {
            throw "MSIX artifact is empty: $msix"
          }

          $makeAppxCommand = Get-Command 'makeappx.exe' -ErrorAction SilentlyContinue
          $makeAppxPath = if ($null -eq $makeAppxCommand) { "" } else { $makeAppxCommand.Source }
          if ([string]::IsNullOrWhiteSpace($makeAppxPath)) {
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $makeAppxPath = Get-ChildItem $sdkRoot -Recurse -Filter 'makeappx.exe' |
              Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($makeAppxPath)) {
            throw "Could not find makeappx.exe for MSIX verification"
          }

          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null

          & $makeAppxPath unpack /p $msix /d $extractDir /o
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX unpack failed with exit code $LASTEXITCODE"
          }

          $manifest = Join-Path $extractDir 'AppxManifest.xml'
          $exe = Join-Path $extractDir 'qp.exe'
          $pdfiumDir = Join-Path $extractDir 'pdfium'
          $licenseDir = Join-Path $extractDir 'licenses'
          $assetsDir = Join-Path $extractDir 'Assets'

          if (-not (Test-Path $manifest -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing AppxManifest.xml"
          }
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing qp.exe"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'LICENSE') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing bundled PDFium license"
          }
          if (-not (Test-Path (Join-Path $pdfiumDir 'licenses') -PathType Container)) {
            throw "Unpacked MSIX layout is missing PDFium component licenses"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'QuickPresenter-LICENSE.txt') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Quick Presenter license"
          }
          if (-not (Test-Path (Join-Path $licenseDir 'PDFium-LICENSE.txt') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing PDFium license copy"
          }
          if (-not (Test-Path (Join-Path $assetsDir 'Square44x44Logo.png') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Square44x44Logo.png"
          }
          if (-not (Test-Path (Join-Path $assetsDir 'Square150x150Logo.png') -PathType Leaf)) {
            throw "Unpacked MSIX layout is missing Square150x150Logo.png"
          }

          $manifestText = Get-Content $manifest -Raw
          if ($manifestText -notmatch 'Name="QuickPresenter\.QuickPresenter"') {
            throw "MSIX manifest has unexpected identity name"
          }
          if ($manifestText -notmatch 'ProcessorArchitecture="x64"') {
            throw "MSIX manifest has unexpected processor architecture"
          }
          if ($manifestText -notmatch 'Name="Windows\.Desktop"') {
            throw "MSIX manifest is missing Windows.Desktop target family"
          }
          if ($manifestText -notmatch 'Executable="qp\.exe"') {
            throw "MSIX manifest is missing qp.exe application entry"
          }
          if ($manifestText -notmatch 'Name="runFullTrust"') {
            throw "MSIX manifest is missing runFullTrust capability"
          }

          Push-Location $env:TEMP
          try {
            & $exe --smoke-open-pdf $pdf
            if ($LASTEXITCODE -ne 0) {
              throw "Unpacked MSIX smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Sign Windows package artifacts
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $packagePaths = @(
            (Join-Path $artifactDir 'Quick Presenter.msi'),
            (Join-Path $artifactDir 'Quick Presenter.msix')
          )
          scripts/sign_windows_artifacts.ps1 `
            -Path $packagePaths `
            -PfxPath '${{ steps.windows-signing.outputs.pfx_path }}' `
            -PfxPassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' `
            -ExpectedPublisher '${{ steps.windows-signing.outputs.publisher }}'

      - name: Verify Windows signed artifacts
        if: runner.os == 'Windows' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          scripts/sign_windows_artifacts.ps1 `
            -ArtifactDir 'artifacts/${{ matrix.artifact-name }}' `
            -PfxPath '${{ steps.windows-signing.outputs.pfx_path }}' `
            -PfxPassword $env:WINDOWS_SIGNING_CERT_PASSWORD `
            -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' `
            -ExpectedPublisher '${{ steps.windows-signing.outputs.publisher }}' `
            -VerifyOnly

      - name: Smoke test staged artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact-name }}"
          pdf="$GITHUB_WORKSPACE/tests/fixtures/marp-speaker-notes.pdf"

          (
            cd /tmp
            env -u PDFIUM_DYNAMIC_LIB_PATH "$artifact_dir/${{ matrix.binary-name }}" \
              --smoke-open-pdf "$pdf"
          )

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            (
              cd /tmp
              env -u PDFIUM_DYNAMIC_LIB_PATH "$artifact_dir/Quick Presenter.app/Contents/MacOS/qp" \
                --smoke-open-pdf "$pdf"
            )
          fi

      - name: Smoke test staged artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:PDFIUM_DYNAMIC_LIB_PATH -ErrorAction SilentlyContinue

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/${{ matrix.artifact-name }}'
          $exe = Join-Path $artifactDir '${{ matrix.binary-name }}'
          $pdf = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/marp-speaker-notes.pdf'

          Push-Location $env:TEMP
          try {
            & $exe --smoke-open-pdf $pdf
            if ($LASTEXITCODE -ne 0) {
              throw "Smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Clean Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'quick-presenter-signing.pfx'
          Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/${{ matrix.artifact-name }}
          if-no-files-found: error
