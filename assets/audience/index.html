<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Presenter Audience</title>
<style>body{font:18px system-ui;background:#202124;color:#fff;max-width:36rem;margin:3rem auto;padding:1.5rem}p{line-height:1.6}button{font:inherit;padding:.7rem;min-width:48px;min-height:48px}#reactions{display:flex;flex-wrap:wrap;gap:.5rem}#reactions button{font-size:2rem}button:disabled{opacity:.45}</style>
<h1>Quick Presenter</h1><h2>Audience Live</h2><p id="status" role="status">Connecting…</p>
<div id="reactions" aria-label="Reactions">
<button disabled data-kind="thumbs_up" aria-label="Thumbs up">👍</button>
<button disabled data-kind="heart" aria-label="Heart">❤️</button>
<button disabled data-kind="applause" aria-label="Applause">👏</button>
<button disabled data-kind="laugh" aria-label="Laugh">😂</button>
<button disabled data-kind="question" aria-label="Question">❓</button>
</div>
<p id="feedback" role="status">Send a reaction to the presenter.</p>
<button id="retry" hidden>Reconnect</button>
<script>
const status=document.getElementById('status'), retry=document.getElementById('retry'), feedback=document.getElementById('feedback');
const buttons=[...document.querySelectorAll('[data-kind]')];
const token=new URLSearchParams(location.hash.slice(1)).get('k');
history.replaceState(null,'',location.pathname);
let socket, enabled=false, nextId=0, pending=null, timeout;
function updateButtons(){buttons.forEach(b=>b.disabled=!enabled || pending!==null);}
function finish(){clearTimeout(timeout);pending=null;updateButtons();}
function connect(){
  if(!token){status.textContent='Open the complete join link or scan the QR code.';return;}
  retry.hidden=true;enabled=false;finish();status.textContent='Connecting…';
  const current=new WebSocket(`ws://${location.host}/ws`);socket=current;
  current.onopen=()=>current.send(JSON.stringify({v:1,token}));
  current.onmessage=event=>{
    if(socket!==current)return;
    try{
      const message=JSON.parse(event.data);
      if(message.v!==1){current.close();return;}
      if(message.type==='welcome' || message.type==='settings'){
        enabled=message.reactions_enabled===true;
        status.textContent=enabled?'Connected to the presentation.':'Connected. Reactions are paused by the presenter.';
        updateButtons();
      }else if(message.type==='result' && message.request_id===pending){
        feedback.textContent=({accepted:'Reaction received.',disabled:'Reactions are paused.',rate_limited:'Please slow down.',busy:'The presentation is busy. Try again shortly.'})[message.status] || 'Unable to send reaction.';
        finish();
      }
    }catch{current.close();}
  };
  current.onclose=()=>{if(socket!==current)return;enabled=false;finish();status.textContent='Disconnected. Reconnect while the session is active, or scan the new QR code.';retry.hidden=false;};
  current.onerror=()=>{if(socket===current)status.textContent='Unable to connect. Check that you are on the same network.';};
}
buttons.forEach(button=>button.onclick=()=>{
  if(!enabled || pending!==null || socket.readyState!==WebSocket.OPEN)return;
  pending=String(++nextId);updateButtons();feedback.textContent='Sending…';
  socket.send(JSON.stringify({v:1,type:'reaction',request_id:pending,kind:button.dataset.kind}));
  timeout=setTimeout(()=>{feedback.textContent='No response. Reconnect to try again.';socket.close();},4000);
});
retry.onclick=connect;
connect();
</script></html>
