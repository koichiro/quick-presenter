[package]
name = "quick-presenter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.15"
slint = "1.16"
pdfium-render = "0.9.1"

[build-dependencies]
slint-build = "1.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSImage",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSObject",
] }
