[package]
name = "quick-presenter"
version = "1.4.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "quick-presenter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
notify = "8.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
pdfium-render = "=0.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.18.1"
winresource = { version = "0.1.31", default-features = false }

[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
winit = { path = "vendor/winit" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSImage",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSObject",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
